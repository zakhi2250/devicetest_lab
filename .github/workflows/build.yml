name: Build FAP

# Baut die .fap automatisch bei jedem Push / Tag und bei manuellem Start.
# Ergebnis: herunterladbares Artefakt (immer) + Release-Datei (bei Tag v*).
#
# Nutzt ufbt direkt (pip), ohne Drittanbieter-Action. Der GitHub-Runner laedt
# dabei SDK + ARM-Toolchain der offiziellen Firmware selbst herunter.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: # Button "Run workflow" im Actions-Tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ufbt installieren
        run: pip install --upgrade ufbt

      - name: SDK holen (offizielle Firmware, stable)
        run: ufbt update --channel=release

      - name: FAP bauen
        run: ufbt

      - name: Build-Ausgabe anzeigen
        run: ls -lR dist || true

      - name: Artefakt hochladen (Download im Actions-Run)
        uses: actions/upload-artifact@v4
        with:
          name: devicetest_lab-fap
          path: dist/*.fap
          if-no-files-found: error

      - name: An Release anhaengen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.fap
