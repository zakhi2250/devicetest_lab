name: Build FAP

# Baut die .fap automatisch bei jedem Push / Tag und bei manuellem Start.
# Ergebnis: herunterladbares Artefakt (immer) + Release-Datei (bei Tag v*).
#
# Nutzt ufbt direkt (pip), ohne Drittanbieter-Action. Der GitHub-Runner laedt
# dabei SDK + ARM-Toolchain der offiziellen Firmware selbst herunter.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch: # Button "Run workflow" im Actions-Tab

permissions:
  contents: write # noetig, damit der Release-Schritt die .fap anhaengen darf

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ufbt installieren
        run: pip install --upgrade ufbt

      - name: SDK holen (offizielle Firmware, stable)
        run: ufbt update --channel=release

      - name: FAP bauen
        run: ufbt

      - name: FAP einsammeln (flach, eine Datei) + Diagnose
        run: |
          echo "== dist listing =="
          ls -lR dist || true
          mkdir -p out
          # genau eine .fap flach nach out/ kopieren, fester Name
          fap="$(find dist -maxdepth 2 -name '*.fap' | head -1)"
          echo "gefundene fap: $fap"
          cp "$fap" out/devicetest_lab.fap
          ls -l out
          # Diagnose als Annotation sichtbar machen (Logs sind extern gesperrt)
          echo "::notice title=FAP-Build::$(ls -l out/devicetest_lab.fap)"

      - name: Artefakt hochladen (Download im Actions-Run)
        uses: actions/upload-artifact@v4
        with:
          name: devicetest_lab-fap
          path: out/devicetest_lab.fap
          if-no-files-found: error

      # Fertige .fap als Datei in den Branch "prebuilt" legen -> direkter
      # Download-Link (handytauglich, ohne Login). Laeuft nur auf main/master,
      # der Push nach "prebuilt" loest keinen neuen Build aus (nicht in Trigger).
      - name: .fap als Datei ins Repo (Branch prebuilt)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp out/devicetest_lab.fap devicetest_lab.fap
          git checkout -B prebuilt
          git add -f devicetest_lab.fap
          git commit -m "prebuilt: devicetest_lab.fap ($(date -u +%Y-%m-%dT%H:%MZ)) [skip ci]" || echo "keine Aenderung"
          git push -f origin prebuilt

      - name: An Release anhaengen (nur bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.fap
